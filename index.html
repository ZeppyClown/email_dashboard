<title>Hermes Digest Board</title>
<link rel="stylesheet" href="style.css">
<!-- Before style.css-dependent markup: the hide rule must be in effect on first
     paint, or the board flashes up before auth-gate.js can hide it. -->
<link rel="stylesheet" href="auth-gate.css">
<div id="authgate" hidden></div>
<script type="module" src="auth-gate.js"></script>

<div class="topbar">
  <h1>Hermes Digest</h1>
  <!-- Local-only page: generated by scripts/build_packages_page.py and
       gitignored, so this link 404s on the deployed Pages site by design. -->
  <a class="chip" href="packages.html">Resume packages</a>
  <div class="filters" id="filters"></div>
  <div class="auth" id="auth"></div>
</div>

<div class="toolbar">
  <input type="search" id="search" class="search" placeholder="Search title, summary, employer…" autocomplete="off">
  <label class="toggle">
    <input type="checkbox" id="hideExpired" checked>
    Hide past deadlines
  </label>
  <!-- Only meaningful while the hackathon pill is active, so app.js shows and
       hides the whole group rather than leaving a dead control in the bar. -->
  <label class="toggle" id="teamSizeWrap" hidden>
    Team size
    <select id="teamSize">
      <option value="">any</option>
      <option value="1">1 (solo)</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
    </select>
  </label>
  <!-- Same treatment as team size: only meaningful while the internship pill
       is active. A dropdown rather than chips because there are 17 roles —
       that many pills wrap onto three lines and bury the category filter. -->
  <label class="toggle" id="roleWrap" hidden>
    Role
    <select id="role">
      <option value="">any</option>
    </select>
  </label>
  <span class="count" id="count"></span>
</div>

<div class="board" id="board">
  <div class="column" data-status="new">
    <h2>New <span class="col-count" data-count="new"></span></h2>
    <div class="cards" data-status="new"></div>
  </div>
  <div class="column" data-status="interested">
    <h2>Interested <span class="col-count" data-count="interested"></span></h2>
    <div class="cards" data-status="interested"></div>
  </div>
  <div class="column" data-status="done">
    <h2>Done <span class="col-count" data-count="done"></span></h2>
    <div class="cards" data-status="done"></div>
  </div>
  <div class="column" data-status="not_interested">
    <h2>Not interested <span class="col-count" data-count="not_interested"></span></h2>
    <div class="cards" data-status="not_interested"></div>
  </div>
</div>

<p class="hint" id="hint"></p>

<div class="backdrop" id="backdrop"></div>
<div class="drawer" id="drawer">
  <button class="drawer-close" id="drawerClose">✕</button>
  <div id="drawerContent"></div>
</div>

<script type="module" src="app.js"></script>
